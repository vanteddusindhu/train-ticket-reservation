<!DOCTYPE html>
<html>
<head>
    <title>Train Ticket Reservation</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Train Ticket Reservation</h1>

        <label>From Station</label>
        <input type="text" id="from" placeholder="Enter source station">

        <label>To Station</label>
        <input type="text" id="to" placeholder="Enter destination station">

        <label>Passenger Name</label>
        <input type="text" id="passenger" placeholder="Enter passenger name">

        <label>Age</label>
        <input type="number" id="age" placeholder="Enter age">

        <button onclick="bookTicket()">Book Ticket</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
